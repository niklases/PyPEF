defaults:
  - override hydra/job_logging: disabled  # Prevents creation of .log file from Hydra

DMS_idx: ???
split_method: ???
llm: ???
DMS_reference_file_path: ../data/DMS_substitutions.csv
DMS_data_folder_singles: ../data/cv_folds_singles_substitutions
DMS_data_folder_multiples: ../data/cv_folds_multiples_substitutions
DMS_MSA_data_path: ../data/DMS_msa_files
DMS_PDB_data_path: ../data/ProteinGym_AF2_structures
output_scores_folder: model_scores/supervised_substitutions

hybrid_model_split_scheme: "block-random"
loss_method: "spearman-hybrid"
n_ensemble_splits: 1
refit_full_train: false  # refit supervised sub-models on the full training fold after weight fitting
clip_std_preds: null     # clip standardized sub-model predictions to +-value (e.g. 4.0)
ridge_block_cv: false    # DCA-Ridge alpha via CV over contiguous blocks of mutated positions
gp_lr: 0.05              # learning rate of the GP hyperparameter optimization (Kermut: 0.1)
gp_standardize_targets: false  # train the GPs on standardized targets (as Kermut)
gp_pmpnn_probs: false    # ProteinMPNN instead of PLM amino acid probabilities in the PLM GPs' structure kernel
gauss_comb_plm_emb: false      # additional GP on the concatenated embeddings of all PLMs
gp_comb_all_zero_shot: false   # all zero-shot scores (PLMs, DCA, ProteinMPNN) in the combined GP's linear mean
use_dca_ridge: true      # include the supervised DCA-Ridge model as an ensemble member
prediction_cache_folder: null  # save per-fold sub-model predictions (ttest + test) for offline ensemble evaluation
seed: 2026
progress_bar: false
overwrite: false

# Disables Hydra logging functionality
hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: .
  job_logging:
    disable_existing_loggers: False
